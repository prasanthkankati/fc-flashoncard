<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC Editorial Dispatch • Mobile-Optimized Edition (1080 × 1350)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090A0E;
      color: #FCEEEA;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px;
    }
    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .brand-meta {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .red-bar {
      width: 6px;
      height: 32px;
      background: #E51D24;
      border-radius: 2px;
    }
    h1 { font-size: 20px; font-weight: 900; letter-spacing: -0.4px; }
    .subtitle { font-size: 12px; color: #8D92A0; }

    .controls-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    button {
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-red {
      background: #E51D24;
      color: #FFFFFF;
      border: none;
      box-shadow: 0 4px 18px rgba(229, 29, 36, 0.35);
    }
    .btn-red:hover { background: #ff2a32; transform: translateY(-1px); }
    .btn-dark { background: #141620; color: #FCEEEA; }
    .btn-dark:hover { background: #1F2232; }

    .theme-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #12141C;
      padding: 5px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 24px;
    }
    .theme-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #6C7284;
      padding: 0 10px;
      text-transform: uppercase;
    }
    .theme-btn {
      background: transparent;
      border: none;
      color: #8D92A0;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .theme-btn.active {
      background: #E51D24;
      color: #FFFFFF;
      box-shadow: 0 2px 10px rgba(229, 29, 36, 0.35);
    }
    .view-toggle { margin-left: auto; display: flex; gap: 4px; }

    .studio-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }
    .slide-viewport {
      position: relative;
      width: 480px;
      height: 600px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.1);
      background: #FFFFFF;
    }
    .slide-item { display: none; width: 100%; height: 100%; }
    .slide-item.active { display: block; }
    .slide-item svg { width: 100%; height: 100%; display: block; }

    .carousel-nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .nav-arrow {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-size: 18px;
      background: #141620;
      color: #FCEEEA;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .nav-arrow:hover { background: #1F2232; }
    .dots { display: flex; gap: 8px; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #252838;
      cursor: pointer;
      transition: all 0.25s;
    }
    .dot.active {
      background: #E51D24;
      width: 24px;
      border-radius: 8px;
    }

    .thumbs-row {
      display: flex;
      gap: 12px;
      max-width: 1200px;
      overflow-x: auto;
      padding: 8px 4px;
    }
    .thumb-card {
      flex: 0 0 96px;
      height: 120px;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.5;
      background: #FFFFFF;
      transition: all 0.2s;
    }
    .thumb-card:hover { opacity: 0.85; }
    .thumb-card.active {
      border-color: #E51D24;
      opacity: 1;
      transform: scale(1.04);
      box-shadow: 0 8px 24px rgba(229, 29, 36, 0.3);
    }
    .thumb-card svg { width: 100%; height: 100%; pointer-events: none; }

    #gridView {
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 28px;
      width: 100%;
      max-width: 1200px;
      margin-top: 10px;
    }
    .grid-card {
      background: #12141C;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .grid-preview {
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      background: #FFFFFF;
    }
    .grid-preview svg { width: 100%; height: 100%; display: block; }
    .grid-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px;
    }
    .grid-title { font-size: 13px; font-weight: 700; color: #FCEEEA; }

    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #141620;
      color: #FCEEEA;
      border: 1px solid #E51D24;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.8);
      font-size: 13px;
      font-weight: 700;
      display: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

    function setTheme(theme) {
      currentTheme = theme;

    function toggleView(mode) {
      const cStage = document.getElementById('carouselStage');
      const gStage = document.getElementById('gridView');
      const btnC = document.getElementById('view-carousel-btn');
      const btnG = document.getElementById('view-grid-btn');

        cStage.style.display = 'none';
        gStage.style.display = 'grid';
        btnG.classList.add('active');
        btnC.classList.remove('active');
      } else {
        cStage.style.display = 'flex';
        gStage.style.display = 'none';
        btnC.classList.add('active');
        btnG.classList.remove('active');

    /* Segmented Story Progress Bar Component (Y: 1205px) */
    function renderProgressBar(currentIdx, isWhite) {
      const total = 6;
      const totalWidth = 900;
      const gap = 8;
      const segWidth = (totalWidth - (gap * (total - 1))) / total;
      const red = "#E51D24";
      const inactiveColor = isWhite ? "rgba(0,0,0,0.14)" : "rgba(255,255,255,0.16)";

      let bars = '<g transform="translate(90, 1205)">';
      for (let s = 0; s < total; s++) {
        const x = s * (segWidth + gap);
        const color = s <= currentIdx ? red : inactiveColor;
        bars += `<rect x="${x}" y="0" width="${segWidth}" height="5" rx="2.5" fill="${color}"/>`;
      }
      bars += '</g>';
      return bars;

    /* Master Render Function for Posters */

                <text x="-212" y="0" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="${greenLive}">LIVE TODAY</text>

                <tspan x="0" y="80">WHICH PROJECT</tspan>

                <tspan x="0" y="344" fill="${red}">MOST?</tspan>
              </text>
              <rect x="0" y="380" width="95" height="6" rx="2" fill="${red}"/>

            <g transform="translate(90, 620)">

        const item = HYD_DATA[index - 1];

          <svg viewBox="0 0 1080 1350" width="1080" height="1350">
            <rect width="1080" height="1350" fill="${bgColor}"/>

            <!-- HEADER BAR: Y: 55 to 110 -->

              <g transform="translate(900, 28)">
                <circle cx="-230" cy="-7" r="7" fill="${greenLive}"/>
                <text x="-212" y="0" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="${greenLive}">LIVE TODAY</text>
                <text x="-95" y="0" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="${mutedColor}">• 11 NOV 2026</text>
              </g>
            </g>
            <line x1="90" y1="110" x2="990" y2="110" stroke="${hairlineColor}" stroke-width="1.5"/>

            <!-- UPPER ZONE: Bebas Neue with Numbers Highlighted in Red -->
            <g transform="translate(90, 145)">
              <text font-family="'Bebas Neue', sans-serif" font-size="88" font-weight="900" fill="${textColor}" letter-spacing="2" line-height="0.94">
                ${item.headlineLines.map((l, li) => `<tspan x="0" y="${74 + (li * 82)}" fill="${l.isHighlight ? red : textColor}">${l.text}</tspan>`).join('')}
              </text>
              <rect x="0" y="${item.headlineLines.length * 82 + 18}" width="95" height="6" rx="2" fill="${red}"/>

              <g transform="translate(0, ${item.headlineLines.length * 82 + 55})">
                <text font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="600" fill="${subtextColor}" line-height="1.45">
                  ${wrapSafeText(item.summary, 34).map((line, li) => `<tspan x="0" y="${li * 36}">${line}</tspan>`).join('')}
                </text>
              </g>
            </g>

            <!-- Vector Art -->
            <g transform="translate(630, 145)">
              ${getBlendedVectorArt(item.vectorType, isWhite)}

            <!-- LOWER ZONE: 3 PUNCHY NEWS BULLETS -->
            <g transform="translate(90, 620)">
              ${item.points.map((pt, pi) => `
                <g transform="translate(0, ${pi * 182})">
                  <rect width="900" height="158" rx="18" fill="${cardBg}" stroke="${hairlineColor}" stroke-width="1.5"/>
                  <circle cx="40" cy="50" r="9" fill="${red}"/>
                  <text x="40" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="700" fill="${textColor}" line-height="1.45">
                    ${wrapSafeText(pt, 46).map((line, li) => `<tspan x="72" y="${52 + (li * 38)}">${line}</tspan>`).join('')}
                  </text>
                </g>
              `).join('')}

            <!-- SEGMENTED STORY PROGRESS BAR -->
            ${renderProgressBar(index, isWhite)}

            <!-- FOOTER BAR: Logo in CENTER-BOTTOM Safe Zone (Audio Icon Collision-Free) -->
            <g transform="translate(90, 1245)">
              <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="${mutedColor}">SOURCE: ${item.source}</text>
              
              <!-- CENTER-BOTTOM SAFE POSITION -->
              <g transform="translate(415, 2)">
                <image href="${currentLogo}" x="0" y="0" width="75" height="36" preserveAspectRatio="xMidYMid meet"/>
              </g>

              <text x="900" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="${red}" text-anchor="end">SWIPE →</text>
            </g>
          </svg>
        `;
      }
    }

    function wrapSafeText(text, maxChars) {
      const words = text.split(' ');
      const lines = [];
      let current = '';
      for (const w of words) {
        if ((current + ' ' + w).trim().length <= maxChars) {
          current = (current + ' ' + w).trim();
        } else {
          if (current) lines.push(current);
          current = w;
        }
      }
      if (current) lines.push(current);
      return lines;
    }

    /* Master Render */
    function renderAll() {
      const viewport = document.getElementById('slideViewport');
      const dots = document.getElementById('dotsContainer');
      const thumbs = document.getElementById('thumbsRow');
      const grid = document.getElementById('gridView');

      viewport.innerHTML = '';
      dots.innerHTML = '';
      thumbs.innerHTML = '';
      grid.innerHTML = '';

      for (let i = 0; i < totalSlides; i++) {
        const svgString = renderDispatchSlide(i);

        // Viewport
        const item = document.createElement('div');
        item.className = 'slide-item' + (i === currentIndex ? ' active' : '');
        item.id = 'slide-' + i;
        item.innerHTML = svgString;
        viewport.appendChild(item);

        // Dot
        const dot = document.createElement('div');
        dot.className = 'dot' + (i === currentIndex ? ' active' : '');
        dot.id = 'dot-' + i;
        dot.onclick = () => goToSlide(i);
        dots.appendChild(dot);

        // Thumb
        const thumb = document.createElement('div');
        thumb.className = 'thumb-card' + (i === currentIndex ? ' active' : '');
        thumb.id = 'thumb-' + i;
        thumb.onclick = () => goToSlide(i);
        thumb.innerHTML = svgString;
        thumbs.appendChild(thumb);

        // Grid
        const card = document.createElement('div');
        card.className = 'grid-card';
        card.innerHTML = `
          <div class="grid-preview">${svgString}</div>
          <div class="grid-meta">
            <span class="grid-title">Slide 0${i + 1}</span>
            <button class="btn-dark" style="padding:6px 12px; font-size:12px;" onclick="exportSinglePng(${i})">⬇ PNG</button>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    function goToSlide(index) {
      for (let i = 0; i < totalSlides; i++) {
        document.getElementById('slide-' + i)?.classList.toggle('active', i === index);
        document.getElementById('dot-' + i)?.classList.toggle('active', i === index);
        document.getElementById('thumb-' + i)?.classList.toggle('active', i === index);
      }
      currentIndex = index;
    }

    function nextSlide() { goToSlide((currentIndex + 1) % totalSlides); }
    function prevSlide() { goToSlide((currentIndex - 1 + totalSlides) % totalSlides); }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    /* PNG Exporter */
    /* PNG Render Helper */
    function renderSvgToBlob(slideIndex) {
      return new Promise((resolve) => {
        const svgEl = document.querySelector(`#slide-${slideIndex} svg`);
        const svgString = new XMLSerializer().serializeToString(svgEl);
        const canvas = document.getElementById('exportCanvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();

        const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);

        img.onload = () => {
          ctx.clearRect(0, 0, 1080, 1350);
          ctx.drawImage(img, 0, 0, 1080, 1350);
          URL.revokeObjectURL(url);

          canvas.toBlob((blob) => {
            resolve(blob);
          }, 'image/png', 1.0);
        };
        img.src = url;
      });
    }

    async function exportSinglePng(slideIndex) {
      showToast(`Rendering Slide 0${slideIndex + 1} PNG...`);
      const blob = await renderSvgToBlob(slideIndex);
      const downloadUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = downloadUrl;
      a.download = `FC-Dispatch-${currentTheme}-0${slideIndex + 1}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(downloadUrl);
      showToast(`Slide 0${slideIndex + 1} Downloaded!`);
    }

    async function downloadCurrentPng() {
      await exportSinglePng(currentIndex);
    }

    async function downloadAllZip() {
      if (typeof JSZip === 'undefined') {
        showToast('JSZip is still loading, please retry in a second...');
        return;
      }
      showToast('Rendering all 6 slides into a single ZIP folder...');
      try {
        const zip = new JSZip();
        const folder = zip.folder(`FC-Dispatch-${currentTheme.toUpperCase()}`);

        for (let i = 0; i < totalSlides; i++) {
          showToast(`Packaging Slide 0${i + 1} of ${totalSlides}...`);
          const blob = await renderSvgToBlob(i);
          const slideName = i === 0 ? 'Slide-01-Cover.png' :
                            i === totalSlides - 1 ? 'Slide-06-Outro.png' :
                            `Slide-0${i + 1}-${HYD_DATA[i - 1]?.id || 'story'}.png`;
          folder.file(slideName, blob);
        }

        showToast('Compressing ZIP folder...');
        const zipBlob = await zip.generateAsync({ type: 'blob' });
        const downloadUrl = URL.createObjectURL(zipBlob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `FC-Editorial-Dispatch-${currentTheme.toUpperCase()}-${new Date().toISOString().slice(0, 10)}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);
        showToast('✔ Complete Folder (.ZIP) downloaded!');
      } catch (err) {
        console.error(err);
        showToast('Export failed. Check console.');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2600);
    }

    window.onload = renderAll;
  </script>
