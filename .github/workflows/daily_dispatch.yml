name: FC Editorial Dispatch • Automated Cloud Runner

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Edition to run'
        required: true
        default: 'hyderabad'
        type: choice
        options:
          - hyderabad
          - global
      approval_timeout:
        description: 'Mobile approval timeout in minutes'
        required: false
        default: '30'

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Install Playwright Headless Chromium & System Fonts
        run: |
          playwright install chromium --with-deps
          sudo apt-get update && sudo apt-get install -y fonts-liberation fontconfig
          fc-cache -fv

      - name: 🔐 Configure Secrets & Instagram Session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_SESSION_B64: ${{ secrets.IG_SESSION_B64 }}
          INSTAGRAM_POSTING_METHOD: ${{ secrets.INSTAGRAM_POSTING_METHOD }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          echo "Writing config.json from repository secrets..."
          cat <<EOF > config.json
          {
            "TELEGRAM_BOT_TOKEN": "${TELEGRAM_BOT_TOKEN}",
            "TELEGRAM_CHAT_ID": "${TELEGRAM_CHAT_ID}",
            "INSTAGRAM_POSTING_METHOD": "${INSTAGRAM_POSTING_METHOD:-playwright}",
            "INSTAGRAM_ACCESS_TOKEN": "${INSTAGRAM_ACCESS_TOKEN:-}",
            "INSTAGRAM_ACCOUNT_ID": "${INSTAGRAM_ACCOUNT_ID:-}"
          }
          EOF

          if [ -n "${IG_SESSION_B64}" ]; then
            echo "Restoring Instagram browser session from secret..."
            echo "${IG_SESSION_B64}" | base64 --decode > ig_session.json
            echo "ig_session.json successfully restored ($(wc -c < ig_session.json) bytes)."
          else
            echo "Warning: IG_SESSION_B64 secret is not set. Browser publishing will be skipped."
          fi

      - name: 🚀 Run FC Editorial Dispatch Pipeline
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_TIMEOUT: ${{ inputs.approval_timeout }}
          AUTO_APPROVE: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TOPIC="${INPUT_TOPIC:-hyderabad}"
          TIMEOUT_MINS="${INPUT_TIMEOUT:-30}"
          export APPROVAL_TIMEOUT_SECONDS=$(( TIMEOUT_MINS * 60 ))
          echo "Running FC Dispatch for topic: $TOPIC (Approval timeout: ${TIMEOUT_MINS}m / ${APPROVAL_TIMEOUT_SECONDS}s)"
          if [ "$TOPIC" = "global" ]; then
            python render_and_send_global.py
          else
            python daily_dispatch.py
          fi

      - name: 📤 Archive Rendered 1080×1350 PNG Slides
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fc-dispatch-slides-${{ github.run_number }}
          path: dist/*/*.png
          retention-days: 30

      - name: 💾 Commit & Push Updated History (Deduplication Persistence)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.json index.html
          git diff --staged --quiet || (git commit -m "chore(auto): update posted stories history [skip ci]" && git push)
