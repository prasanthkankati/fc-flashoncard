<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&amp;display=swap');
      .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8FA949" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0C0D12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="#0C0D12"/>

  <!-- Header Bar -->
  <g transform="translate(80, 80)">
    <!-- Small FC Logo Mark -->
    <g transform="scale(0.38)">
      <rect x="0" y="0" width="100" height="100" rx="18" fill="#DFBF2B"/>
      <rect x="12" y="8" width="100" height="100" rx="18" fill="#8974F8"/>
      <rect x="24" y="16" width="100" height="100" rx="18" fill="#EB3B24"/>
      <circle cx="106" cy="36" r="12" fill="#8FA949"/>
      <text x="74" y="80" class="font-sans" font-size="44" font-weight="900" fill="#FCEEEA" text-anchor="middle">FC</text>
    </g>

    <!-- Category Pill -->
    <g transform="translate(70, 0)">
      <rect width="260" height="44" rx="22" fill="#8FA949"/>
      <text x="130" y="28" class="font-sans" font-size="16" font-weight="800" fill="#0C0D12" text-anchor="middle" letter-spacing="1.5">CLEAN ENERGY</text>
    </g>

    <!-- Slide Index -->
    <g transform="translate(830, 0)">
      <rect width="90" height="44" rx="22" fill="#181A24" stroke="#2B2F40" stroke-width="1.5"/>
      <text x="45" y="28" class="font-sans" font-size="17" font-weight="800" fill="#FCEEEA" text-anchor="middle">04 / 06</text>
    </g>
  </g>

  <!-- Headline -->
  <g transform="translate(80, 175)">
    <text class="font-sans" font-size="52" font-weight="900" fill="#FCEEEA" line-height="1.15">
      <tspan x="0" y="0">India Crosses Historic 200 GW</tspan>
      <tspan x="0" y="64">Renewable Power Capacity</tspan>
      <tspan x="0" y="128" fill="#8FA949">Ahead of 2026 Target.</tspan>
    </text>
  </g>

  <!-- Graphic Container -->
  <g transform="translate(80, 360)">
    <rect width="920" height="520" rx="32" fill="#141620" stroke="#232738" stroke-width="2"/>
    <rect width="920" height="520" rx="32" fill="url(#greenGlow)"/>

    <!-- Large Metric Dial / Gauge -->
    <g transform="translate(460, 240)">
      <!-- Arc Background -->
      <path d="M -180 60 A 190 190 0 1 1 180 60" fill="none" stroke="#202434" stroke-width="24" stroke-linecap="round"/>
      <!-- Active Arc (200 GW) -->
      <path d="M -180 60 A 190 190 0 1 1 130 -100" fill="none" stroke="#8FA949" stroke-width="24" stroke-linecap="round"/>

      <text x="0" y="15" class="font-sans" font-size="76" font-weight="900" fill="#FCEEEA" text-anchor="middle">201.2</text>
      <text x="0" y="60" class="font-sans" font-size="22" font-weight="800" fill="#8FA949" text-anchor="middle" letter-spacing="3">GIGAWATTS (GW)</text>
    </g>

    <!-- Solar & Wind Vector Silhouette Accents -->
    <g transform="translate(100, 310)">
      <!-- Solar Array Polygons -->
      <polygon points="20,70 120,40 180,90 80,120" fill="#1B1F30" stroke="#DFBF2B" stroke-width="2"/>
      <polygon points="110,70 210,40 270,90 170,120" fill="#1B1F30" stroke="#DFBF2B" stroke-width="2"/>
    </g>

    <g transform="translate(680, 240)">
      <!-- Wind Turbine Silhouette -->
      <line x1="100" y1="50" x2="100" y2="190" stroke="#8D92A0" stroke-width="4"/>
      <line x1="100" y1="50" x2="60" y2="10" stroke="#8FA949" stroke-width="3"/>
      <line x1="100" y1="50" x2="140" y2="10" stroke="#8FA949" stroke-width="3"/>
      <line x1="100" y1="50" x2="100" y2="95" stroke="#8FA949" stroke-width="3"/>
      <circle cx="100" cy="50" r="7" fill="#FCEEEA"/>
    </g>

    <!-- Data Badges -->
    <g transform="translate(60, 430)">
      <rect width="250" height="50" rx="16" fill="#1C1F2E" stroke="#31364D" stroke-width="1.5"/>
      <text x="20" y="32" class="font-sans" font-size="16" font-weight="700" fill="#8FA949">▲ 45.4% OF TOTAL GRID</text>
    </g>
    <g transform="translate(330, 430)">
      <rect width="250" height="50" rx="16" fill="#1C1F2E" stroke="#31364D" stroke-width="1.5"/>
      <text x="20" y="32" class="font-sans" font-size="16" font-weight="700" fill="#DFBF2B">● 500 GW BY 2030 TARGET</text>
    </g>
  </g>

  <!-- News Content (3 Punchy Lines) -->
  <g transform="translate(80, 920)">
    <g transform="translate(0, 0)">
      <circle cx="16" cy="22" r="10" fill="#8FA949"/>
      <text x="44" y="27" class="font-sans" font-size="24" font-weight="700" fill="#FCEEEA">Rapid utility-scale solar additions across Rajasthan and Gujarat officially</text>
      <text x="44" y="60" class="font-sans" font-size="24" font-weight="700" fill="#FCEEEA">pushed non-fossil fuel installed capacity beyond 200,000 MW.</text>
    </g>
    <g transform="translate(0, 95)">
      <circle cx="16" cy="22" r="10" fill="#DFBF2B"/>
      <text x="44" y="27" class="font-sans" font-size="24" font-weight="700" fill="#FCEEEA">Green energy now supplies more than 45% of India’s operational power</text>
      <text x="44" y="60" class="font-sans" font-size="24" font-weight="700" fill="#FCEEEA">mix, beating international Paris Accord projections months ahead of time.</text>
    </g>
    <g transform="translate(0, 190)">
      <circle cx="16" cy="22" r="10" fill="#8974F8"/>
      <text x="44" y="27" class="font-sans" font-size="24" font-weight="700" fill="#FCEEEA">The national grid operator reported zero blackout rates during peak hours,</text>
      <text x="44" y="60" class="font-sans" font-size="24" font-weight="700" fill="#FCEEEA">bolstered by new battery storage system integrations.</text>
    </g>
  </g>

  <!-- Footer Meta -->
  <g transform="translate(80, 1220)">
    <line x1="0" y1="0" x2="920" y2="0" stroke="#232738" stroke-width="1.5"/>
    <text x="0" y="44" class="font-sans" font-size="18" font-weight="600" fill="#8D92A0">SOURCE: Central Electricity Authority (CEA) / MNRE</text>
    <text x="920" y="44" class="font-sans" font-size="18" font-weight="700" fill="#8FA949" text-anchor="end">SWIPE NEXT →</text>
  </g>
</svg>