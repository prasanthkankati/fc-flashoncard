<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&amp;display=swap');
      .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#EB3B24" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0C0D12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trainSpeed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EB3B24" stop-opacity="0"/>
      <stop offset="70%" stop-color="#EB3B24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#DFBF2B" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="#0C0D12"/>

  <!-- Header Bar -->
  <g transform="translate(80, 80)">
    <!-- Small FC Logo Mark -->
    <g transform="scale(0.38)">
      <rect x="0" y="0" width="100" height="100" rx="18" fill="#DFBF2B"/>
      <rect x="12" y="8" width="100" height="100" rx="18" fill="#8974F8"/>
      <rect x="24" y="16" width="100" height="100" rx="18" fill="#EB3B24"/>
      <circle cx="106" cy="36" r="12" fill="#8FA949"/>
      <text x="74" y="80" class="font-sans" font-size="44" font-weight="900" fill="#FCEEEA" text-anchor="middle">FC</text>
    </g>

    <!-- Category Pill -->
    <g transform="translate(70, 0)">
      <rect width="280" height="44" rx="22" fill="#EB3B24"/>
      <text x="140" y="28" class="font-sans" font-size="16" font-weight="800" fill="#FCEEEA" text-anchor="middle" letter-spacing="1.5">INFRASTRUCTURE</text>
    </g>

    <!-- Slide Index -->
    <g transform="translate(830, 0)">
      <rect width="90" height="44" rx="22" fill="#181A24" stroke="#2B2F40" stroke-width="1.5"/>
      <text x="45" y="28" class="font-sans" font-size="17" font-weight="800" fill="#FCEEEA" text-anchor="middle">05 / 06</text>
    </g>
  </g>

  <!-- Headline -->
  <g transform="translate(80, 175)">
    <text class="font-sans" font-size="52" font-weight="900" fill="#FCEEEA" line-height="1.15">
      <tspan x="0" y="0">Bullet Train Corridor Passes</tspan>
      <tspan x="0" y="64">300 KM Viaduct Milestone</tspan>
      <tspan x="0" y="128" fill="#EB3B24">Ahead of Rolling Tests.</tspan>
    </text>
  </g>

  <!-- Graphic Container -->
  <g transform="translate(80, 360)">
    <rect width="920" height="520" rx="32" fill="#141620" stroke="#232738" stroke-width="2"/>
    <rect width="920" height="520" rx="32" fill="url(#redGlow)"/>

    <!-- High Speed Track Horizon -->
    <line x1="60" y1="320" x2="860" y2="320" stroke="#2F354A" stroke-width="8"/>
    <line x1="60" y1="334" x2="860" y2="334" stroke="#1F2332" stroke-width="4"/>

    <!-- Viaduct Concrete Pillars -->
    <rect x="140" y="328" width="50" height="90" rx="8" fill="#252A3C"/>
    <rect x="360" y="328" width="50" height="90" rx="8" fill="#252A3C"/>
    <rect x="580" y="328" width="50" height="90" rx="8" fill="#252A3C"/>
    <rect x="760" y="328" width="50" height="90" rx="8" fill="#252A3C"/>

    <!-- Speed Streaks -->
    <line x1="80" y1="210" x2="420" y2="210" stroke="#EB3B24" stroke-width="3" stroke-dasharray="24,12"/>
    <line x1="180" y1="250" x2="520" y2="250" stroke="#8974F8" stroke-width="2" stroke-dasharray="16,8"/>
    <line x1="120" y1="290" x2="600" y2="290" stroke="#DFBF2B" stroke-width="4" stroke-dasharray="32,16"/>

    <!-- Bullet Train Aerodynamic Silhouette -->
    <g transform="translate(420, 210)">
      <!-- Train Body -->
      <path d="M 0 100 L 260 100 C 350 100 400 80 430 40 L 410 40 C 360 40 320 10 240 10 L 0 10 Z" fill="#FCEEEA"/>
      <!-- Nose Aerodynamic Stripe -->
      <path d="M 180 60 L 390 60 C 410 60 420 50 428 42 L 350 42 Z" fill="#EB3B24"/>
      <!-- Window Strip -->
      <path d="M 20 30 L 260 30 C 290 30 330 36 340 46 L 20 46 Z" fill="#0C0D12"/>
      <!-- Cab glow headlight -->
      <polygon points="426,46 470,42 470,54 426,50" fill="#DFBF2B"/>
    </g>

    <!-- Data Badges -->
    <g transform="translate(60, 430)">
      <rect width="250" height="50" rx="16" fill="#1C1F2E" stroke="#31364D" stroke-width="1.5"/>
      <text x="20" y="32" class="font-sans" font-size="16" font-weight="700" fill="#EB3B24">▲ 320 KM/H DESIGN SPEED</text>
    </g>
    <g transform="translate(330, 430)">
      <rect width="260" height="50" rx="16" fill="#1C1F2E" stroke="#31364D" stroke-width="1.5"/>
      <text x="20" y="32" class="font-sans" font-size="16" font-weight="700" fill="#DFBF2B">● MUMBAI-AHMEDABAD</text>
    </g>
  </g>

  <!-- News Content (3 Punchy Lines) -->
  <g transform="translate(80, 920)">
    <g transform="translate(0, 0)">
      <circle cx="16" cy="22" r="10" fill="#EB3B24"/>
      <text x="44" y="27" class="font-sans" font-size="24" font-weight="700" fill="#FCEEEA">National High Speed Rail Corporation (NHSRCL) confirmed over 300 km</text>
      <text x="44" y="60" class="font-sans" font-size="24" font-weight="700" fill="#FCEEEA">of continuous elevated viaduct structure is fully cast and erected.</text>
    </g>
    <g transform="translate(0, 95)">
      <circle cx="16" cy="22" r="10" fill="#DFBF2B"/>
      <text x="44" y="27" class="font-sans" font-size="24" font-weight="700" fill="#FCEEEA">High-speed Japanese Shinkansen track-slab laying system has been deployed</text>
      <text x="44" y="60" class="font-sans" font-size="24" font-weight="700" fill="#FCEEEA">across Gujarat sections, completing 50+ km of ballastless track bed.</text>
    </g>
    <g transform="translate(0, 190)">
      <circle cx="16" cy="22" r="10" fill="#8974F8"/>
      <text x="44" y="27" class="font-sans" font-size="24" font-weight="700" fill="#FCEEEA">Trial operations on the Surat-Bilimora priority sector are scheduled to begin</text>
      <text x="44" y="60" class="font-sans" font-size="24" font-weight="700" fill="#FCEEEA">following overhead electrification tests later this year.</text>
    </g>
  </g>

  <!-- Footer Meta -->
  <g transform="translate(80, 1220)">
    <line x1="0" y1="0" x2="920" y2="0" stroke="#232738" stroke-width="1.5"/>
    <text x="0" y="44" class="font-sans" font-size="18" font-weight="600" fill="#8D92A0">SOURCE: NHSRCL / Ministry of Railways</text>
    <text x="920" y="44" class="font-sans" font-size="18" font-weight="700" fill="#EB3B24" text-anchor="end">SWIPE NEXT →</text>
  </g>
</svg>